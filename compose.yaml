services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ['3000:3000']
    depends_on: [mongo, redis]
volumes:
  mongo_data:
  redis_data:
